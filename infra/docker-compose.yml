name: blabzu

# Local dev stack: Postgres (source of truth), Typesense (search index), Redis (caches).
# Start:  docker compose -f infra/docker-compose.yml --env-file .env up -d
# Stop:   docker compose -f infra/docker-compose.yml down        (add -v to wipe data)

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blabzu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blabzu}
      POSTGRES_DB: ${POSTGRES_DB:-blabzu}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blabzu} -d ${POSTGRES_DB:-blabzu}"]
      interval: 5s
      timeout: 3s
      retries: 20

  typesense:
    image: typesense/typesense:30.1
    restart: unless-stopped
    command: ["--data-dir", "/data", "--api-key", "${TYPESENSE_API_KEY:-dev-typesense-key}", "--enable-cors"]
    ports:
      - "${TYPESENSE_PORT:-8108}:8108"
    volumes:
      - tsdata:/data
    # No healthcheck: the image doesn't guarantee curl. Check with: curl http://localhost:8108/health

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  tsdata:
